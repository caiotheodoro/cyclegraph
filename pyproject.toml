# W0: the interface freeze. `pydantic` is load-bearing for CONTRACTS.md and pinned.
# Everything downstream of a method choice -- the spectral estimator, the label source,
# the bootstrap -- is deliberately unresolved: pinning those before docs/SURVEY.md's
# novelty gate runs would be a guess presented as a decision. See docs/DECISIONS.md D001.

[project]
name = "cyclegraph"
version = "0.0.0"
description = "Reading a dataset vendor's quality metric as an occupational-exposure metric, at corpus scale."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
]

# Extras map 1:1 to the modules in docs/ARCHITECTURE.md. An extra that does not name a
# module, or a module with no extra, means the architecture and the packaging have drifted.
[project.optional-dependencies]
corpus     = ["huggingface_hub>=0.35", "pillow>=10"]
signal     = ["numpy>=1.26", "opencv-python-headless>=4.9"]
cycles     = ["numpy>=1.26", "scipy>=1.11"]
exposure   = ["numpy>=1.26"]
estimation = ["numpy>=1.26", "scipy>=1.11"]
# scikit-learn/joblib: script runtimes for the labeller (`docs/DECISIONS.md` D022), not
# packaged under `src/`. Pulled into dev so CI can exercise the probe tests offline.
dev        = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "scikit-learn>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. These are runtimes used by
# `scripts/` -- the detector and the labeller -- and deliberately not `[project]` extras:
# `docs/DECISIONS.md` D022 keeps model runtimes out of `src/cyclegraph/`, so they name no
# module in `docs/ARCHITECTURE.md` and an extra for them would be the drift this file warns
# about.
module = ["scipy", "scipy.*", "cv2", "cv2.*", "sklearn", "sklearn.*", "joblib", "joblib.*",
          "torch", "torch.*", "torchvision", "torchvision.*", "transformers", "transformers.*",
          "mmseg", "mmseg.*"]
ignore_missing_imports = true
